[package]
name = "quick_search"
version = "0.1.0"
edition = "2021"
description = "Deterministic claim verification and predicate-bitset citation search engine"
license = "MIT"

[dependencies]
anyhow = "1.0"
bitvec = { version = "1.0", features = ["serde"] }
byteorder = "1.5"
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
regex = "1.10"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
strsim = "0.11"
thiserror = "1.0"
walkdir = "2.5"
rayon = "1.10"

[dev-dependencies]
tempfile = "3.10"

[profile.release]
lto = true
codegen-units = 1
strip = true
